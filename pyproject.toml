[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncap"
version = "0.1.0"
description = "Neural cellular automata playground and research core"
requires-python = ">=3.11"
dependencies = ["torch>=2.2,<3", "pillow>=10,<13"]

[project.scripts]
ncap-train = "ncap.cli:train_main"
ncap-simulate = "ncap.cli:simulate_main"
ncap-evaluate = "ncap.cli:evaluate_main"

ncap-recovery = "ncap.cli:recovery_main"

ncap-study = "ncap.cli:study_main"

ncap-persistence = "ncap.cli:persistence_main"

ncap-horizons = "ncap.cli:horizon_main"

ncap-bounds = "ncap.cli:bounds_main"

ncap-objective = "ncap.cli:objective_main"

ncap-budgets = "ncap.cli:budget_main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
